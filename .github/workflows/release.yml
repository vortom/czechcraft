name: Release

on:
  push:
    tags: ["v*"]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run datagen
        run: ./gradlew :fabric:runDatagen

      - name: Verify committed datagen output is current
        run: |
          if ! git diff --quiet -- 'fabric/src/main/generated/' ':!fabric/src/main/generated/.cache/'; then
            echo "::error::Datagen output is out-of-date. Run ./gradlew :fabric:runDatagen and commit the changes."
            git diff -- 'fabric/src/main/generated/' ':!fabric/src/main/generated/.cache/'
            exit 1
          fi

      - name: Build (compiles + runs tests with generated output in place)
        run: ./gradlew build

      - name: Publish to Modrinth
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        # `modrinth` uploads the version jar; `modrinthSyncBody` is a separate
        # minotaur task that pushes README.md content to the project body —
        # without it the Modrinth listing description stays empty.
        run: ./gradlew :fabric:modrinth :fabric:modrinthSyncBody

      - name: Verify Modrinth body sync landed
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        # Fail the release if the body sync silently did nothing — e.g. PAT
        # missing the "Write projects" scope, or minotaur task ordering broke.
        run: |
          body=$(curl -sf -H "Authorization: $MODRINTH_TOKEN" \
            "https://api.modrinth.com/v2/project/czechcraft" \
            | jq -r '.body // ""')
          length=${#body}
          if [ "$length" -lt 100 ]; then
            echo "::error::Modrinth project body is suspiciously short ($length chars). Body sync likely failed — check PAT scopes and minotaur task output above."
            exit 1
          fi
          echo "Modrinth body length: $length chars — sync looks healthy."

      - name: Set per-version environment metadata on Modrinth
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        # Per Modrinth's March 2026 environment-metadata overhaul, this is
        # set per-Version (not per-Project) via the v3 API. minotaur 2.9.0
        # doesn't yet expose this in its DSL, so we PATCH it manually.
        #
        # CzechCraft = "client_and_server" because the server must register
        # the item / recipes and the client must render textures and lang.
        # If a future version becomes client-only or server-only, change
        # this value and the verify check below.
        run: |
          TAG=${GITHUB_REF#refs/tags/v}
          VERSION_ID=$(curl -sf \
            -H "Authorization: $MODRINTH_TOKEN" \
            "https://api.modrinth.com/v3/project/czechcraft/version" \
            | jq -r --arg n "$TAG" '.[] | select(.version_number == $n) | .id' | head -1)
          if [ -z "$VERSION_ID" ]; then
            echo "::error::Could not resolve Modrinth version ID for tag v$TAG — was the upload step skipped?"
            exit 1
          fi
          echo "Patching environment=client_and_server on Modrinth version $VERSION_ID"
          curl -sf -X PATCH \
            -H "Authorization: $MODRINTH_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"environment":"client_and_server"}' \
            "https://api.modrinth.com/v3/version/$VERSION_ID"
          actual=$(curl -sf -H "Authorization: $MODRINTH_TOKEN" \
            "https://api.modrinth.com/v3/version/$VERSION_ID" \
            | jq -r '.environment // ""')
          if [ "$actual" != "client_and_server" ]; then
            echo "::error::Environment field did not stick (expected client_and_server, got: '$actual')"
            exit 1
          fi
          echo "Environment metadata confirmed: $actual"

      - name: Extract changelog section for this tag
        id: changelog
        run: |
          TAG=${GITHUB_REF#refs/tags/v}
          # Pull the section between "## [TAG]" and the next "## [" header.
          awk -v tag="$TAG" '
            $0 ~ "^## \\[" tag "\\]" { found=1; next }
            found && /^## \[/        { exit }
            found                    { print }
          ' CHANGELOG.md > release-body.md
          echo "body_path=release-body.md" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: ${{ steps.changelog.outputs.body_path }}
          files: fabric/build/libs/*.jar
