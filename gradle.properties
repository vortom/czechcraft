# JVM
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
# IntelliJ + Loom 1.15 compat — see fabric-loom #1349
org.gradle.configuration-cache=false

# Mod metadata
mod_id=czechcraft
mod_version=1.1.0
mod_group=cz.czechcraft
mod_name=CzechCraft

# Minecraft / loader (no mappings — MC 26.1+ ships unobfuscated)
# minecraft_version is the COMPILE target only. Build against the lowest supported
# version ("compile low, run high") — a 26.1.2-built jar is verified to run on 26.2.
minecraft_version=26.1.2

# The versions we actually SUPPORT — deliberately separate from the compile target.
# This range is a claim that has been TESTED, never an aspiration. 26.3 is excluded
# because it renamed the recipe_unlocked trigger field ("recipe" -> "recipes"), which
# makes our generated advancement unparseable and stops the game booting entirely.
# Widening this range requires re-running the version smoke test first.
minecraft_supported_range=>=26.1.2 <26.3-
# Only versions verified by an actual in-game smoke test are listed. 26.1 and 26.1.1
# were advertised on Modrinth until v1.1.0 but never worked: the range has always been
# >=26.1.2, so the loader rejected them. Listing them was a false claim, not lost support.
minecraft_supported_versions=26.1.2,26.2
loader_version=0.19.2
loom_version=1.15.5

# Fabric
fabric_api_version=0.145.4+26.1.2
# Minimum Fabric API players must have. "*" (accept anything) was wrong: we call
# FabricCreativeModeTab.builder and would fail obscurely against an older API.
# Fabric ignores "+build" metadata when comparing, so 0.159.0+26.2 satisfies this.
fabric_api_min=0.145.4

# Java
java_version=25
